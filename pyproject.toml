[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented interactivity claims."
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
interactive-claim-audit = "interactive_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
